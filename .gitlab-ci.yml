
stages:          # List of stages for jobs, and their order of execution
  - build
  - package

variables:
  NSIS_EXE:  'C:\Program Files (x86)\NSIS\makensis.exe'
  EXPORT_PATH: 'C:\gitlab\Sccx'
  
build-sps:       # This job runs in the build stage of sps
  stage: build
  script:
    - $env:WORKSPACE = $CI_PROJECT_DIR
    - . $CI_GENERATOR $CI_PROJECT_DIR\test\build.xml
  artifacts:
    paths: 
      - src/logfile.txt


build_Library:
  stage: build
  tags:
    - windows
  needs:
    - build-sps
  #rules:
  #  - if: $CI_COMMIT_TAG =~ /^[vV]\d+\.\d+\.\d+(-RC\d+)?$/
  script:
    - $env:WORKSPACE = $CI_PROJECT_DIR
    - . $CI_GENERATOR $CI_PROJECT_DIR\test\library.xml     
  artifacts:
    paths: 
      - "TestFramework_*.library"

build_installers:
  stage: package
  tags:
    - windows
  needs:
    - build-sps
  rules:
    - if: $CI_COMMIT_TAG =~ /^[vV]\d+\.\d+\.\d+(-RC\d+)?$/
  script:
    - |
      git clone $CI_NSIS_REPO nsis

      $Version      = $env:CI_COMMIT_TAG
      $BasePath     = "$env:CI_PROJECT_DIR"
      $PythonPath   = "$env:CI_PROJECT_DIR\nsis\Python"
      $NsiDir       = "$env:CI_PROJECT_DIR\nsis\Python\Installer"
      $env:WORKSPACE = $CI_PROJECT_DIR
      
      # ---- Sigmatek ----
      Write-Host "Building Beckhoff installer..."       
      
      & "$env:NSIS_EXE" `
          "/DVersion=$Version" `
          "/DBasePath=$BasePath" `
          "/DPythonPath=$PythonPath" `
          "$NsiDir\Beckhoff_Testframework.nsi"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $Src  = "$NsiDir\TC3_Testframework_$Version.exe"
      $Dest = "$env:EXPORT_PATH\TC3_Testframework_$Version.exe"
      Move-Item -Path $Src -Destination $Dest -Force
      Write-Host "Beckhoff -> $Dest"

      $Zip = "$env:EXPORT_PATH\TC3_Testframework_.zip"
      if (Test-Path $Zip) { Remove-Item $Zip }
      Compress-Archive -Path $Dest -DestinationPath $Zip
      Write-Host "Beckhoff ZIP erstellt"
      
      